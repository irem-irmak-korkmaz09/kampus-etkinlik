<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kampüs Etkinlikleri</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlik-detay.html">Detay</a>
        <a href="etkinlik-ekle.html">Ekle</a>
        <a href="etkinlik-guncelle.html">Güncelle</a>
      </nav>
    </header>
    <main>
      <h1>Etkinlik Güncelle</h1>

      <form action="#" method="post">
        <label for="ad">Etkinlik Adı</label><br />
        <input
          type="text"
          id="ad"
          name="ad"
          value="Kariyer Günleri 2026"
          required
        /><br /><br />

        <label for="kategori">Kategori</label><br />
        <select id="kategori" name="kategori">
          <option value="seminer" selected>Seminer</option>
          <option value="atolye">Atölye</option>
          <option value="sosyal">Sosyal</option></select
        ><br /><br />

        <label for="tarih">Tarih / Saat</label><br />
        <input
          type="datetime-local"
          id="tarih"
          name="tarih"
          value="2026-10-12T14:00"
          required
        /><br /><br />

        <label for="yer">Yer</label><br />
        <input
          type="text"
          id="yer"
          name="yer"
          value="A Blok Konferans Salonu"
          required
        /><br /><br />

        <label for="aciklama">Açıklama</label><br />
        <textarea id="aciklama" name="aciklama" rows="4" required>
Kariyer planlaması ve sektör temsilcileriyle bire bir görüşme imkanı.</textarea
        ><br /><br />

        <button type="submit">Güncelle</button>
      </form>
    </main>

    <footer>
      <p>İrem Irmak Korkmaz · 2516501815 · 2026</p>
    </footer>
  </body>
</html>
