<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2516501815.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html">Ekle</a>
      </nav>
    </header>
    <main>
      <h1>Etkinlik Ekle</h1>

      <form id="etkinlik-formu" novalidate>
        <label for="ad">Etkinlik Adı</label><br />
        <input type="text" id="ad" name="ad" required /><br /><br />

        <label for="kategori">Kategori</label><br />
        <select id="kategori" name="kategori">
          <option value="seminer">Seminer</option>
          <option value="atolye">Atölye</option>
          <option value="sosyal">Sosyal</option></select
        ><br /><br />

        <label for="tarih">Tarih / Saat</label><br />
        <input
          type="datetime-local"
          id="tarih"
          name="tarih"
          required
        /><br /><br />

        <label for="yer">Yer</label><br />
        <input type="text" id="yer" name="yer" required /><br /><br />

        <label for="aciklama">Açıklama</label><br />
        <textarea id="aciklama" name="aciklama" rows="4" required></textarea
        ><br /><br />

        <button type="submit">Kaydet</button>
      </form>
    </main>

    <footer>
      <p>İrem Irmak Korkmaz · 2516501815 · 2026</p>
    </footer>
  </body>
</html>
