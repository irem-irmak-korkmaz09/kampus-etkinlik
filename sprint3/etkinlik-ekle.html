<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2516501815.css" />
    <script type="module" src="js/event-form.js"></script>
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html">Ekle</a>
      </nav>
    </header>
    <main>
      <h1>Etkinlik Ekle</h1>
      <p class="aciklama-metni">Yıldızlı (*) alanlar zorunludur. Bu sprintte tüm veri kaydedilmez; sonuç aşağıda gösterilir.</p>

      <form id="etkinlik-formu" novalidate>
        <div class="form-grup">
          <label for="ad">Etkinlik Adı *</label>
          <input type="text" id="ad" name="ad" required />
          <span id="ad-hata" class="hata-metin"></span>
        </div>

        <div class="form-grup">
          <label for="kategori">Kategori *</label>
          <select id="kategori" name="kategori" required>
            <option value="">Seçiniz</option>
            <option value="Seminer">Seminer</option>
            <option value="Atölye">Atölye</option>
            <option value="Söyleşi">Söyleşi</option>
            <option value="Sosyal">Sosyal</option>
          </select>
          <span id="kategori-hata" class="hata-metin"></span>
        </div>

        <div class="form-grup">
          <label for="tarih">Tarih *</label>
          <input type="date" id="tarih" name="tarih" required />
          <span id="tarih-hata" class="hata-metin"></span>
        </div>

        <div class="form-grup">
          <label for="saat">Saat *</label>
          <input type="time" id="saat" name="saat" required />
          <span id="saat-hata" class="hata-metin"></span>
        </div>

        <div class="form-grup">
          <label for="yer">Yer *</label>
          <input type="text" id="yer" name="yer" placeholder="Örn. A Blok Konferans Salonu" required />
          <span id="yer-hata" class="hata-metin"></span>
        </div>

        <div class="form-grup">
          <label for="kontenjan">Kontenjan</label>
          <input type="number" id="kontenjan" name="kontenjan" />
          <span id="kontenjan-hata" class="hata-metin"></span>
        </div>

        <div class="form-grup">
          <label for="aciklama">Açıklama</label>
          <textarea id="aciklama" name="aciklama" rows="4"></textarea>
        </div>

        <button type="submit" class="buton-kaydet">Kaydet</button>
      </form>

      <div id="form-mesaj" class="form-mesaj-alani"></div>
    </main>

    <footer>
      <p>İrem Irmak Korkmaz · 2516501815 · 2026</p>
    </footer>
  </body>
</html>
